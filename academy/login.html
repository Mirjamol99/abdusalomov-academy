<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kirish | Abdusalomov Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #020617;
            background-image:
                radial-gradient(circle at 15% 15%, rgba(6, 182, 212, .10), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(20, 184, 166, .08), transparent 30%);
        }

        html {
            scroll-behavior: smooth;
        }

        .glass {
            background: rgba(15, 23, 42, 0.78);
            border: 1px solid rgba(51, 65, 85, 0.75);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, .28);
        }

        .login-card {
            transition: border-color .25s ease, box-shadow .25s ease, transform .25s ease;
        }

        .login-card:hover {
            border-color: rgba(34, 211, 238, .28);
            box-shadow: 0 28px 90px rgba(0, 0, 0, .32);
        }

        .brand-dot {
            box-shadow: 0 0 30px rgba(34, 211, 238, .22);
        }

        input {
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(34, 211, 238, .08);
        }
    </style>
</head>

<body class="min-h-screen text-white flex items-center justify-center px-5 py-10">

    <div class="w-full max-w-lg">

        <!-- LOGO -->
        <div class="text-center mb-8">

            <div class="inline-flex items-center justify-center gap-3">
                <span class="brand-dot w-3 h-3 rounded-full bg-cyan-400"></span>
                <a href="./index.html" class="text-3xl font-extrabold tracking-tight">
                    <span class="text-cyan-400">Abdusalomov</span> Academy
                </a>
            </div>

            <p class="text-slate-400 mt-3">
                Academy akkauntingizga kiring 🚀
            </p>

        </div>


        <!-- LOGIN CARD -->
        <div class="glass login-card rounded-3xl p-7 md:p-9 shadow-2xl">

            <h1 class="text-3xl font-extrabold text-center">
                🔐 Kirish
            </h1>

            <p class="text-slate-400 text-center mt-2">
                O‘qishni davom ettiring
            </p>


            <!-- FORM -->
            <form id="loginForm" class="mt-8 space-y-5">


                <!-- EMAIL -->
                <div>

                    <label for="email" class="block mb-2 font-semibold">
                        📧 Email
                    </label>

                    <input id="email" type="email" placeholder="example@gmail.com" autocomplete="email" required class="
                            w-full
                            bg-slate-950
                            border border-slate-700
                            rounded-2xl
                            px-5 py-4
                            outline-none
                            transition
                            focus:border-cyan-400
                        ">

                </div>


                <!-- PASSWORD -->
                <div>

                    <label for="password" class="block mb-2 font-semibold">
                        🔒 Parol
                    </label>


                    <div class="relative">

                        <input id="password" type="password" placeholder="Parolingiz" autocomplete="current-password"
                            required class="
                                w-full
                                bg-slate-950
                                border border-slate-700
                                rounded-2xl
                                px-5 py-4
                                pr-14
                                outline-none
                                transition
                                focus:border-cyan-400
                            ">


                        <!-- PASSWORD TOGGLE -->
                        <button type="button" id="togglePassword" aria-label="Parolni ko‘rsatish"
                            title="Parolni ko‘rsatish" class="
                                absolute
                                right-4
                                top-1/2
                                -translate-y-1/2
                                text-xl
                                text-slate-400
                                hover:text-white
                                transition
                            ">
                            👁️
                        </button>

                    </div>

                </div>


                <!-- ERROR MESSAGE -->
                <div id="errorMessage" class="
                        hidden
                        text-red-400
                        bg-red-400/10
                        border border-red-400/20
                        rounded-xl
                        p-4
                    "></div>


                <!-- SUCCESS MESSAGE -->
                <div id="successMessage" class="
                        hidden
                        text-green-400
                        bg-green-400/10
                        border border-green-400/20
                        rounded-xl
                        p-4
                    "></div>


                <!-- LOGIN BUTTON -->

                <button type="submit" class="
                        w-full
                        bg-cyan-500
                        hover:bg-cyan-400
                        active:scale-[0.98]
                        text-slate-950
                        font-extrabold
                        py-4
                        rounded-2xl
                        transition
                    ">
                    🚀 Kirish
                </button>

            </form>


            <!-- REGISTER -->
            <div class="text-center mt-7 text-slate-400">

                Akkauntingiz yo‘qmi?

                <a href="./register.html" class="
                        text-cyan-400
                        hover:text-cyan-300
                        font-bold
                    ">
                    Ro‘yxatdan o‘tish
                </a>

            </div>

        </div>


        <!-- BACK HOME -->
        <div class="text-center mt-6">

            <a href="./index.html" class="
                    text-slate-500
                    hover:text-white
                    transition
                ">
                ← Bosh sahifaga qaytish
            </a>

        </div>

    </div>


    <script>

        // ELEMENTLAR
        
        const loginForm =
            document.querySelector("#loginForm");

        const emailInput =
            document.querySelector("#email");

        const passwordInput =
            document.querySelector("#password");

        const togglePassword =
            document.querySelector("#togglePassword");

        const errorMessage =
            document.querySelector("#errorMessage");

        const successMessage =
            document.querySelector("#successMessage");


        // PAROLNI KO‘RISH / YASHIRISH

        togglePassword.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePassword.textContent = "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Parolni yashirish"
                    );

                    togglePassword.setAttribute(
                        "title",
                        "Parolni yashirish"
                    );

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent = "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Parolni ko‘rsatish"
                    );

                    togglePassword.setAttribute(
                        "title",
                        "Parolni ko‘rsatish"
                    );

                }

            }
        );

        // LOGIN

        loginForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                // Xabarlarni tozalash

                errorMessage.classList.add("hidden");

                successMessage.classList.add("hidden");


                // Ma'lumotlarni olish

                const email =
                    emailInput.value.trim().toLowerCase();

                const password =
                    passwordInput.value;

                // USERLARNI LOCALSTORAGE'DAN OLISH

                const users =
                    JSON.parse(
                        localStorage.getItem("academyUsers")
                    ) || [];


                // USERNI QIDIRISH

                const user =
                    users.find(
                        function (item) {

                            return (
                                item.email.toLowerCase() === email &&
                                item.password === password
                            );

                        }
                    );

                // USER TOPILMADI

                if (!user) {

                    errorMessage.textContent =
                        "❌ Email yoki parol noto'g'ri!";

                    errorMessage.classList.remove("hidden");

                    return;
                }

                // LOGIN QILGAN USERNI SAQLASH

                localStorage.setItem(
                    "academyCurrentUser",
                    JSON.stringify(user)
                );

                // MUVAFFAQIYAT

                successMessage.textContent =
                    `✅ Xush kelibsiz, ${user.firstName}!`;

                successMessage.classList.remove("hidden");

                // BOSH SAHIFAGA O‘TISH

                // 1 soniyadan keyin bosh sahifaga o'tish
                setTimeout(function () {

                    window.location.href = "index.html";

                }, 1000);
            }
        );

    </script>

</body>

</html>
