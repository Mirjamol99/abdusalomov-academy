<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ro‘yxatdan o‘tish | Abdusalomov Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at 12% 12%, rgba(6, 182, 212, .10), transparent 30%),
                radial-gradient(circle at 88% 82%, rgba(20, 184, 166, .08), transparent 30%),
                #020617;
        }

        .glass {
            background: rgba(15, 23, 42, .78);
            border: 1px solid rgba(51, 65, 85, .75);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 80px rgba(0, 0, 0, .28);
            transition: border-color .25s ease, box-shadow .25s ease;
        }

        .glass:hover {
            border-color: rgba(34, 211, 238, .28);
            box-shadow: 0 28px 90px rgba(0, 0, 0, .32);
        }

        input {
            transition: border-color .2s ease, box-shadow .2s ease;
        }

        input:focus {
            box-shadow: 0 0 0 3px rgba(34, 211, 238, .08);
        }

        .brand-dot {
            box-shadow: 0 0 30px rgba(34, 211, 238, .25);
        }
    </style>
</head>

<body class="min-h-screen text-white flex items-center justify-center px-5 py-10">

    <div class="w-full max-w-lg">

        <!-- LOGO -->
        <div class="text-center mb-8">

            <div class="inline-flex items-center justify-center gap-3">
                <span class="brand-dot w-3 h-3 rounded-full bg-cyan-400"></span>
                <a
                    href="./index.html"
                    class="text-3xl font-extrabold tracking-tight"
                >
                    <span class="text-cyan-400">Abdusalomov</span> Academy
                </a>
            </div>

            <p class="text-slate-400 mt-3">
                Yangi akkaunt yarating 🚀
            </p>

        </div>


        <!-- REGISTER CARD -->
        <div class="glass rounded-3xl p-7 md:p-9 shadow-2xl">

            <h1 class="text-3xl font-extrabold text-center">
                📝 Ro‘yxatdan o‘tish
            </h1>

            <p class="text-slate-400 text-center mt-2">
                Academy kurslariga qo‘shiling
            </p>


            <!-- FORM -->
            <form id="registerForm" class="mt-8 space-y-5">


                <!-- ISM -->
                <div>

                    <label
                        for="firstName"
                        class="block mb-2 font-semibold"
                    >
                        👤 Ism
                    </label>

                    <input
                        id="firstName"
                        type="text"
                        placeholder="Ismingiz"
                        autocomplete="given-name"
                        required
                        class="
                            w-full
                            bg-slate-950
                            border border-slate-700
                            rounded-2xl
                            px-5 py-4
                            outline-none
                            transition
                            focus:border-cyan-400
                        "
                    >

                </div>


                <!-- FAMILIYA -->
                <div>

                    <label
                        for="lastName"
                        class="block mb-2 font-semibold"
                    >
                        👤 Familiya
                    </label>

                    <input
                        id="lastName"
                        type="text"
                        placeholder="Familiyangiz"
                        autocomplete="family-name"
                        required
                        class="
                            w-full
                            bg-slate-950
                            border border-slate-700
                            rounded-2xl
                            px-5 py-4
                            outline-none
                            transition
                            focus:border-cyan-400
                        "
                    >

                </div>


                <!-- EMAIL -->
                <div>

                    <label
                        for="email"
                        class="block mb-2 font-semibold"
                    >
                        📧 Email
                    </label>

                    <input
                        id="email"
                        type="email"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                        class="
                            w-full
                            bg-slate-950
                            border border-slate-700
                            rounded-2xl
                            px-5 py-4
                            outline-none
                            transition
                            focus:border-cyan-400
                        "
                    >

                </div>


                <!-- TELEFON -->
                <div>

                    <label
                        for="phone"
                        class="block mb-2 font-semibold"
                    >
                        📱 Telefon
                    </label>

                    <input
                        id="phone"
                        type="tel"
                        placeholder="+998 90 123 45 67"
                        autocomplete="tel"
                        required
                        class="
                            w-full
                            bg-slate-950
                            border border-slate-700
                            rounded-2xl
                            px-5 py-4
                            outline-none
                            transition
                            focus:border-cyan-400
                        "
                    >

                </div>


                <!-- PAROL -->
                <div>

                    <label
                        for="password"
                        class="block mb-2 font-semibold"
                    >
                        🔒 Parol
                    </label>

                    <div class="relative">

                        <input
                            id="password"
                            type="password"
                            placeholder="Kamida 6 ta belgi"
                            autocomplete="new-password"
                            minlength="6"
                            required
                            class="
                                w-full
                                bg-slate-950
                                border border-slate-700
                                rounded-2xl
                                px-5 py-4
                                pr-14
                                outline-none
                                transition
                                focus:border-cyan-400
                            "
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            aria-label="Parolni ko'rsatish"
                            title="Parolni ko'rsatish"
                            class="
                                absolute
                                right-4
                                top-1/2
                                -translate-y-1/2
                                text-xl
                                text-slate-400
                                hover:text-white
                                transition
                            "
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- PAROLNI TASDIQLASH -->
                <div>

                    <label
                        for="confirmPassword"
                        class="block mb-2 font-semibold"
                    >
                        🔐 Parolni tasdiqlang
                    </label>

                    <div class="relative">

                        <input
                            id="confirmPassword"
                            type="password"
                            placeholder="Parolni qayta kiriting"
                            autocomplete="new-password"
                            minlength="6"
                            required
                            class="
                                w-full
                                bg-slate-950
                                border border-slate-700
                                rounded-2xl
                                px-5 py-4
                                pr-14
                                outline-none
                                transition
                                focus:border-cyan-400
                            "
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            aria-label="Parolni ko'rsatish"
                            title="Parolni ko'rsatish"
                            class="
                                absolute
                                right-4
                                top-1/2
                                -translate-y-1/2
                                text-xl
                                text-slate-400
                                hover:text-white
                                transition
                            "
                        >
                            👁️
                        </button>

                    </div>

                </div>


                <!-- ERROR -->
                <div
                    id="errorMessage"
                    class="
                        hidden
                        text-red-400
                        bg-red-400/10
                        border border-red-400/20
                        rounded-xl
                        p-4
                    "
                ></div>


                <!-- SUCCESS -->
                <div
                    id="successMessage"
                    class="
                        hidden
                        text-green-400
                        bg-green-400/10
                        border border-green-400/20
                        rounded-xl
                        p-4
                    "
                ></div>


                <!-- REGISTER BUTTON -->
                <button
                    type="submit"
                    class="
                        w-full
                        bg-cyan-500
                        hover:bg-cyan-400
                        active:scale-[0.98]
                        text-slate-950
                        font-extrabold
                        py-4
                        rounded-2xl
                        transition
                    "
                >
                    🚀 Ro'yxatdan o'tish
                </button>

            </form>


            <!-- LOGIN -->
            <div class="text-center mt-7 text-slate-400">

                Akkauntingiz bormi?

                <a
                    href="./login.html"
                    class="
                        text-cyan-400
                        hover:text-cyan-300
                        font-bold
                    "
                >
                    Kirish
                </a>

            </div>

        </div>


        <!-- BACK HOME -->
        <div class="text-center mt-6">

            <a
                href="./index.html"
                class="
                    text-slate-500
                    hover:text-white
                    transition
                "
            >
                ← Bosh sahifaga qaytish
            </a>

        </div>

    </div>


    <script>

        // ==========================================
        // ELEMENTLAR
        // ==========================================

        const registerForm =
            document.querySelector("#registerForm");

        const firstNameInput =
            document.querySelector("#firstName");

        const lastNameInput =
            document.querySelector("#lastName");

        const emailInput =
            document.querySelector("#email");

        const phoneInput =
            document.querySelector("#phone");

        const passwordInput =
            document.querySelector("#password");

        const confirmPasswordInput =
            document.querySelector("#confirmPassword");

        const togglePassword =
            document.querySelector("#togglePassword");

        const toggleConfirmPassword =
            document.querySelector("#toggleConfirmPassword");

        const errorMessage =
            document.querySelector("#errorMessage");

        const successMessage =
            document.querySelector("#successMessage");


        // ==========================================
        // PAROLNI KO‘RISH / YASHIRISH
        // ==========================================

        togglePassword.addEventListener(
            "click",
            function () {

                if (passwordInput.type === "password") {

                    passwordInput.type = "text";

                    togglePassword.textContent = "🙈";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Parolni yashirish"
                    );

                    togglePassword.setAttribute(
                        "title",
                        "Parolni yashirish"
                    );

                } else {

                    passwordInput.type = "password";

                    togglePassword.textContent = "👁️";

                    togglePassword.setAttribute(
                        "aria-label",
                        "Parolni ko‘rsatish"
                    );

                    togglePassword.setAttribute(
                        "title",
                        "Parolni ko‘rsatish"
                    );

                }

            }
        );


        // ==========================================
        // TASDIQLASH PAROLINI KO‘RISH / YASHIRISH
        // ==========================================

        toggleConfirmPassword.addEventListener(
            "click",
            function () {

                if (confirmPasswordInput.type === "password") {

                    confirmPasswordInput.type = "text";

                    toggleConfirmPassword.textContent = "🙈";

                    toggleConfirmPassword.setAttribute(
                        "aria-label",
                        "Parolni yashirish"
                    );

                    toggleConfirmPassword.setAttribute(
                        "title",
                        "Parolni yashirish"
                    );

                } else {

                    confirmPasswordInput.type = "password";

                    toggleConfirmPassword.textContent = "👁️";

                    toggleConfirmPassword.setAttribute(
                        "aria-label",
                        "Parolni ko‘rsatish"
                    );

                    toggleConfirmPassword.setAttribute(
                        "title",
                        "Parolni ko‘rsatish"
                    );

                }

            }
        );


        // ==========================================
        // REGISTER
        // ==========================================

        registerForm.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                // XABARLARNI YASHIRISH

                errorMessage.classList.add("hidden");

                successMessage.classList.add("hidden");


                // MA'LUMOTLARNI OLISH

                const firstName =
                    firstNameInput.value.trim();

                const lastName =
                    lastNameInput.value.trim();

                const email =
                    emailInput.value.trim().toLowerCase();

                const phone =
                    phoneInput.value.trim();

                const password =
                    passwordInput.value;

                const confirmPassword =
                    confirmPasswordInput.value;


                // ==================================
                // PAROL UZUNLIGI
                // ==================================

                if (password.length < 6) {

                    errorMessage.textContent =
                        "❌ Parol kamida 6 ta belgidan iborat bo‘lishi kerak!";

                    errorMessage.classList.remove("hidden");

                    return;
                }


                // ==================================
                // PAROLLARNI TEKSHIRISH
                // ==================================

                if (password !== confirmPassword) {

                    errorMessage.textContent =
                        "❌ Parollar bir xil emas!";

                    errorMessage.classList.remove("hidden");

                    return;
                }


                // ==================================
                // USERLARNI OLISH
                // ==================================

                const users =
                    JSON.parse(
                        localStorage.getItem("academyUsers")
                    ) || [];


                // ==================================
                // EMAILNI TEKSHIRISH
                // ==================================

                const existingUser =
                    users.find(
                        function (user) {

                            return user.email === email;

                        }
                    );


                if (existingUser) {

                    errorMessage.textContent =
                        "❌ Bu email bilan akkaunt allaqachon mavjud!";

                    errorMessage.classList.remove("hidden");

                    return;
                }


                // ==================================
                // YANGI USER
                // ==================================

                const newUser = {

                    id: Date.now(),

                    firstName: firstName,

                    lastName: lastName,

                    email: email,

                    phone: phone,

                    password: password

                };


                // ==================================
                // USERNI ARRAYGA QO‘SHISH
                // ==================================

                users.push(newUser);


                // ==================================
                // LOCALSTORAGE
                // ==================================

                localStorage.setItem(
                    "academyUsers",
                    JSON.stringify(users)
                );


                // ==================================
                // MUVAFFAQIYAT
                // ==================================

                successMessage.textContent =
                    "✅ Ro‘yxatdan o‘tish muvaffaqiyatli amalga oshirildi!";

                successMessage.classList.remove("hidden");


                // FORMNI TOZALASH

                registerForm.reset();


                // ==================================
                // LOGIN SAHIFASIGA O‘TISH
                // ==================================

                setTimeout(
                    function () {

                        window.location.href =
                            "login.html";

                    },
                    1200
                );

            }
        );

    </script>

</body>

</html>
