<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil | Abdusalomov Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #020617;
        }

        .glass {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(51, 65, 85, 0.8);
            backdrop-filter: blur(15px);
        }
    </style>
</head>

<body class="min-h-screen text-white">

    <!-- NAVBAR -->
    <nav class="border-b border-slate-800 bg-slate-950">

        <div class="max-w-6xl mx-auto px-5 py-5 flex items-center justify-between">

            <a
                href="index.html"
                class="text-2xl font-extrabold"
            >
                <span class="text-yellow-400">
                    Abdusalomov
                </span>
                Academy
            </a>

            <a
                href="index.html"
                class="text-slate-400 hover:text-white transition"
            >
                ← Bosh sahifa
            </a>

        </div>

    </nav>


    <!-- PROFILE -->
    <main class="max-w-4xl mx-auto px-5 py-12">

        <div class="text-center mb-10">

            <div
                class="
                    mx-auto
                    w-24
                    h-24
                    rounded-full
                    bg-yellow-400
                    text-slate-950
                    flex
                    items-center
                    justify-center
                    text-4xl
                    font-extrabold
                "
                id="avatar"
            >
                ?
            </div>

            <h1
                id="profileName"
                class="text-3xl font-extrabold mt-5"
            >
                Profil
            </h1>

            <p class="text-slate-400 mt-2">
                Abdusalomov Academy
            </p>

        </div>


        <!-- USER INFO -->
        <div class="glass rounded-3xl p-7 md:p-10">

            <h2 class="text-2xl font-extrabold mb-7">
                👤 Shaxsiy ma'lumotlar
            </h2>


            <!-- ISM -->
            <div
                class="
                    flex
                    flex-col
                    md:flex-row
                    md:items-center
                    justify-between
                    gap-2
                    border-b
                    border-slate-800
                    py-5
                "
            >

                <span class="text-slate-400">
                    👤 Ism va familiya
                </span>

                <span
                    id="fullName"
                    class="font-bold"
                >
                    —
                </span>

            </div>


            <!-- EMAIL -->
            <div
                class="
                    flex
                    flex-col
                    md:flex-row
                    md:items-center
                    justify-between
                    gap-2
                    border-b
                    border-slate-800
                    py-5
                "
            >

                <span class="text-slate-400">
                    📧 Email
                </span>

                <span
                    id="email"
                    class="font-bold break-all"
                >
                    —
                </span>

            </div>


            <!-- PHONE -->
            <div
                class="
                    flex
                    flex-col
                    md:flex-row
                    md:items-center
                    justify-between
                    gap-2
                    border-b
                    border-slate-800
                    py-5
                "
            >

                <span class="text-slate-400">
                    📱 Telefon
                </span>

                <span
                    id="phone"
                    class="font-bold"
                >
                    —
                </span>

            </div>


            <!-- COURSES -->
            <div class="pt-8">

                <h2 class="text-2xl font-extrabold mb-5">
                    📚 Mening kurslarim
                </h2>

                <div
                    id="courses"
                    class="
                        bg-slate-950
                        border
                        border-slate-800
                        rounded-2xl
                        p-6
                        text-center
                    "
                >

                    <div class="text-4xl mb-3">
                        📚
                    </div>

                    <p class="text-slate-400">
                        Hozircha sizda sotib olingan kurslar yo'q.
                    </p>

                    <a
                        href="./courses.html"
                        class="
                            inline-block
                            mt-5
                            bg-blue-600
                            hover:bg-blue-700
                            px-6
                            py-3
                            rounded-xl
                            font-bold
                            transition
                        "
                    >
                        📚 Kurslarni ko'rish
                    </a>

                </div>

            </div>


            <!-- LOGOUT -->
            <div class="mt-8">

                <button
                    id="logoutBtn"
                    class="
                        w-full
                        bg-red-500/10
                        hover:bg-red-500/20
                        border
                        border-red-500/20
                        text-red-400
                        font-bold
                        py-4
                        rounded-2xl
                        transition
                    "
                >
                    🚪 Chiqish
                </button>

            </div>

        </div>

    </main>


    <script>

        // =====================================
        // LOGIN QILGAN USERNI OLISH
        // =====================================

        const currentUser =
            JSON.parse(
                localStorage.getItem("academyCurrentUser")
            );


        // =====================================
        // LOGIN QILINMAGAN BO‘LSA
        // =====================================

        if (!currentUser) {

            window.location.href = "login.html";

        }


        // =====================================
        // USER MA'LUMOTLARI
        // =====================================

        if (currentUser) {

            const firstName =
                currentUser.firstName || "";

            const lastName =
                currentUser.lastName || "";

            const fullName =
                `${firstName} ${lastName}`.trim();


            // ISM

            document.querySelector("#profileName")
                .textContent =
                `👋 ${firstName}`;


            // FULL NAME

            document.querySelector("#fullName")
                .textContent =
                fullName || "—";


            // EMAIL

            document.querySelector("#email")
                .textContent =
                currentUser.email || "—";


            // PHONE

            document.querySelector("#phone")
                .textContent =
                currentUser.phone || "—";


            // AVATAR

            document.querySelector("#avatar")
                .textContent =
                firstName
                    ? firstName.charAt(0).toUpperCase()
                    : "?";

        }


        // =====================================
        // CHIQISH
        // =====================================

        document.querySelector("#logoutBtn")
            .addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "academyCurrentUser"
                    );

                    window.location.href =
                        "index.html";

                }
            );

    </script>

</body>

</html>
