<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil | Abdusalomov Academy</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html {
            scroll-behavior: smooth;
        }

        body {
            background:
                radial-gradient(circle at 10% 10%, rgba(6, 182, 212, .09), transparent 28%),
                radial-gradient(circle at 90% 35%, rgba(20, 184, 166, .07), transparent 25%),
                #020617;
        }

        .glass {
            background: rgba(15, 23, 42, .78);
            border: 1px solid rgba(51, 65, 85, .75);
            backdrop-filter: blur(18px);
            box-shadow: 0 20px 70px rgba(0, 0, 0, .22);
        }

        .info-card {
            transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
        }

        .info-card:hover {
            transform: translateY(-3px);
            border-color: rgba(34, 211, 238, .35);
            box-shadow: 0 16px 45px rgba(0, 0, 0, .22);
        }

        .avatar {
            background: linear-gradient(135deg, #06b6d4, #14b8a6);
            box-shadow:
                0 0 0 8px rgba(6, 182, 212, .08),
                0 0 45px rgba(6, 182, 212, .18);
        }
    </style>
</head>

<body class="min-h-screen text-white">

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 border-b border-slate-800/80 bg-slate-950/85 backdrop-blur-xl">

        <div class="max-w-6xl mx-auto px-5 py-5 flex items-center justify-between">

            <a href="index.html" class="text-2xl md:text-3xl font-extrabold tracking-tight">
                <span class="text-cyan-400">Abdusalomov</span> Academy
            </a>

            <a href="index.html" class="text-slate-400 hover:text-cyan-300 font-medium transition">
                ← Bosh sahifa
            </a>

        </div>

    </nav>


    <!-- PROFILE -->
    <main class="max-w-4xl mx-auto px-5 py-12 md:py-16">

        <!-- PROFILE HEADER -->
        <div class="text-center mb-10">

            <div id="avatar"
                class="avatar mx-auto w-24 h-24 rounded-full text-slate-950 flex items-center justify-center text-4xl font-extrabold">
                ?
            </div>

            <h1 id="profileName" class="text-3xl md:text-4xl font-extrabold mt-6 tracking-tight">
                Profil
            </h1>

            <p class="text-slate-400 mt-2">
                Abdusalomov Academy
            </p>

            <div
                class="mt-4 inline-flex items-center gap-2 px-4 py-2 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-300 text-sm font-semibold">
                <span class="w-2 h-2 rounded-full bg-cyan-400"></span>
                O'quvchi profili
            </div>

        </div>


        <!-- USER INFO -->
        <div class="glass rounded-3xl p-6 md:p-10">

            <h2 class="text-2xl font-extrabold mb-7">
                👤 Shaxsiy ma'lumotlar
            </h2>


            <!-- ISM -->
            <div
                class="info-card flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-800/80 py-5">

                <span class="text-slate-400">
                    👤 Ism va familiya
                </span>

                <span id="fullName" class="font-bold text-right break-words">
                    —
                </span>

            </div>


            <!-- EMAIL -->
            <div
                class="info-card flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-800/80 py-5">

                <span class="text-slate-400">
                    📧 Email
                </span>

                <span id="email" class="font-bold text-right break-all">
                    —
                </span>

            </div>


            <!-- PHONE -->
            <div
                class="info-card flex flex-col md:flex-row md:items-center justify-between gap-3 border-b border-slate-800/80 py-5">

                <span class="text-slate-400">
                    📱 Telefon
                </span>

                <span id="phone" class="font-bold text-right">
                    —
                </span>

            </div>


            <!-- COURSES -->
            <div class="pt-9">

                <h2 class="text-2xl font-extrabold mb-5">
                    📚 Mening kurslarim
                </h2>

                <div id="courses" class="info-card bg-slate-950/70 border border-slate-800 rounded-2xl p-7 text-center">

                    <div
                        class="mx-auto w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/20 text-3xl flex items-center justify-center mb-4">
                        📚
                    </div>

                    <p class="text-slate-400 leading-7">
                        Hozircha sizda sotib olingan kurslar yo'q.
                    </p>

                    <a href="./courses.html"
                        class="inline-flex items-center justify-center gap-2 mt-6 bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-6 py-3 rounded-xl font-bold transition hover:scale-[1.02]">
                        📚 Kurslarni ko'rish
                        <span>→</span>
                    </a>

                </div>

            </div>


            <!-- LOGOUT -->
            <div class="mt-8">

                <button id="logoutBtn"
                    class="w-full bg-red-500/10 hover:bg-red-500/15 border border-red-500/20 hover:border-red-500/35 text-red-400 font-bold py-4 rounded-2xl transition">
                    🚪 Chiqish
                </button>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="border-t border-slate-800/80 py-8 mt-4">

        <div class="max-w-6xl mx-auto px-5 text-center">

            <p class="text-slate-500 text-sm">
                © 2026 Abdusalomov Academy. Barcha huquqlar himoyalangan.
            </p>

        </div>

    </footer>


    <script>

        // =====================================
        // LOGIN QILGAN USERNI OLISH
        // =====================================

        const currentUser =
            JSON.parse(
                localStorage.getItem("academyCurrentUser")
            );


        // =====================================
        // LOGIN QILINMAGAN BO'LSA
        // =====================================

        if (!currentUser) {
            window.location.href = "login.html";
        }


        // =====================================
        // USER MA'LUMOTLARI
        // =====================================

        if (currentUser) {

            const firstName =
                currentUser.firstName || "";

            const lastName =
                currentUser.lastName || "";

            const fullName =
                `${firstName} ${lastName}`.trim();


            document.querySelector("#profileName")
                .textContent =
                firstName
                    ? `👋 ${firstName}`
                    : "Profil";


            document.querySelector("#fullName")
                .textContent =
                fullName || "—";


            document.querySelector("#email")
                .textContent =
                currentUser.email || "—";


            document.querySelector("#phone")
                .textContent =
                currentUser.phone || "—";


            document.querySelector("#avatar")
                .textContent =
                firstName
                    ? firstName.charAt(0).toUpperCase()
                    : "?";

        }


        // =====================================
        // CHIQISH
        // =====================================

        document.querySelector("#logoutBtn")
            .addEventListener(
                "click",
                function () {

                    localStorage.removeItem(
                        "academyCurrentUser"
                    );

                    window.location.href =
                        "index.html";

                }
            );

    </script>

</body>

</html>
