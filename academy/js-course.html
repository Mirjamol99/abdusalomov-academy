//    COMPLETED LESSONS

let completedLessons =
    JSON.parse(
        localStorage.getItem(
            "jsCompletedLessons"
        )
    ) || [];

//    LESSONLARNI CHIQARISH

function renderLessons() {

    const container =
        document.getElementById("lessons");


    container.innerHTML = "";


    lessons.forEach((lesson, index) => {

        const number = index + 1;


        const completed =
            completedLessons.includes(number);


        const unlocked =
            number === 1 ||
            completedLessons.includes(number - 1);


        const card =
            document.createElement("div");


        card.className =
            `lesson-card
             bg-slate-900
             border border-slate-800
             rounded-2xl
             p-6
             ${!unlocked ? "locked" : ""}`;


        let button;


        if (unlocked) {

            button = `

                <a href="js-lesson-${number}.html"

                   class="block
                          text-center
                          bg-cyan-500
                          hover:bg-cyan-400
                          text-slate-950
                          font-extrabold
                          py-3
                          rounded-xl
                          transition">

                    ${
                        completed
                        ? "🔄 Darsni qayta ochish"
                        : "▶️ Darsni boshlash"
                    }

                </a>

            `;

        } else {

            button = `

                <button disabled

                    class="w-full
                           bg-slate-800
                           text-slate-500
                           font-bold
                           py-3
                           rounded-xl">

                    🔒 Avvalgi darsni tugating

                </button>

            `;

        }


        card.innerHTML = `

            <div class="flex
                        items-center
                        justify-between
                        mb-5">

                <span class="text-cyan-400
                             font-extrabold">

                    ${String(number).padStart(2, "0")}-DARS

                </span>


                <span class="text-2xl">

                    ${
                        completed
                        ? "✅"
                        : unlocked
                        ? "🔓"
                        : "🔒"
                    }

                </span>

            </div>


            <div class="text-4xl mb-4">

                ${lesson.icon}

            </div>


            <h2 class="text-xl
                       font-extrabold
                       min-h-[56px]">

                ${lesson.title}

            </h2>


            <p class="text-slate-500
                      text-sm
                      mt-3
                      mb-6">

                JavaScript ${number}-dars

            </p>


            ${button}

        `;


        container.appendChild(card);

    });


    updateProgress();

}

//    PROGRESS

function updateProgress() {

    const count =
        completedLessons.filter(
            number =>
                number >= 1 &&
                number <= 60
        ).length;


    const percent =
        (count / 60) * 100;


    document.getElementById(
        "progressText"
    ).textContent =
        `${count} / 60`;


    document.getElementById(
        "progressBar"
    ).style.width =
        `${percent}%`;

}

//    START

renderLessons();
